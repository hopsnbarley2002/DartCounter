<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oche Board">
<meta name="theme-color" content="#18221e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Oche Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a pub chalkboard. Two team columns (board red vs board green) over a keypad; single dark theme by design. */
:root {
  color-scheme: dark;
  --board: #18221e;
  --board-2: #1f2c27;
  --board-3: #2a3a33;
  --chalk: #eeece3;
  --chalk-dim: #98a69f;
  --line: rgba(238, 236, 227, 0.14);
  --red: #e2503f;
  --red-soft: rgba(226, 80, 63, 0.16);
  --green: #43b06b;
  --green-soft: rgba(67, 176, 107, 0.16);
  --gold: #e9c46a;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-chalk: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--board);
  background-image: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.05), transparent 60%);
  color: var(--chalk);
  font-family: var(--f-num);
  font-size: 17px;
  padding: 16px clamp(16px, 3vw, 32px) 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 12px; }
h1 { font-family: var(--f-chalk); font-weight: 700; font-size: 30px; margin: 0; letter-spacing: 0.5px; }
.legs { font-size: 18px; color: var(--chalk-dim); letter-spacing: 1px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.legs b { color: var(--chalk); font-size: 22px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  background: var(--board-3); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 14px; font-size: 16px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 600;
}
.btn:hover { background: #33463e; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--gold); color: #1b1b14; border-color: transparent; }
.btn.primary:hover { background: #f1d283; }
.btn.danger { border-color: var(--red); color: #ffb3a8; }

/* Teams */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.team {
  background: var(--board-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px 12px; display: grid; gap: 10px; position: relative; overflow: hidden;
  transition: border-color .2s;
}
.team::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--tc); }
.team.active { border-color: var(--tc); box-shadow: 0 0 0 1px var(--tc) inset; }
.team[data-t="0"] { --tc: var(--red); --ts: var(--red-soft); }
.team[data-t="1"] { --tc: var(--green); --ts: var(--green-soft); }
.team-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.team-name { font-family: var(--f-chalk); font-size: 22px; font-weight: 700; color: var(--tc); overflow-wrap: anywhere; }
.team-legs { font-size: 15px; color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.remaining {
  font-size: clamp(64px, 13vw, 128px); font-weight: 700; line-height: 0.9; font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
}
.sub { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--chalk-dim); min-height: 22px; align-items: center; }
.sub .co { color: var(--gold); font-weight: 600; letter-spacing: 0.5px; }
.players { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); padding-top: 8px; }
.players li {
  display: grid; grid-template-columns: 18px 1fr auto auto; gap: 10px; align-items: center;
  padding: 4px 6px; border-radius: 5px; font-variant-numeric: tabular-nums;
}
.players li.now { background: var(--ts); }
.players .mark { color: var(--tc); font-size: 14px; }
.players .pname { font-family: var(--f-chalk); font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.players .avg { font-size: 17px; font-weight: 600; }
.players .meta { font-size: 13px; color: var(--chalk-dim); min-width: 52px; text-align: right; }
.players .hdr { font-size: 12px; color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 1px; padding-block: 0; }

/* Input */
.play { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--board-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.thrower { font-size: 18px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.thrower .who { font-family: var(--f-chalk); font-size: 24px; font-weight: 700; }
.thrower .need { color: var(--chalk-dim); }
.display {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
}
.display .val { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; min-width: 2ch; }
.display .val.empty { color: var(--chalk-dim); font-weight: 500; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
.display .hint { font-size: 14px; color: var(--chalk-dim); text-align: right; }
.quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.quick .wide { grid-column: span 2; }
.quick .dummy { display: grid; line-height: 1; padding-block: 5px; }
.quick .dummy small { font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--chalk-dim); }
.quick button {
  background: var(--board-3); border: 1px solid var(--line); border-radius: 6px; padding: 8px 0;
  font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.quick button:hover { background: #33463e; }
.quick button.ton { color: var(--gold); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pad button {
  background: var(--board-3); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 0; font-size: 28px; font-weight: 600;
}
.pad button:hover { background: #33463e; }
.pad .enter { background: var(--gold); color: #1b1b14; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; border-color: transparent; }
.pad .enter:hover { background: #f1d283; }
.pad .fn { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--chalk-dim); }
.msg { min-height: 22px; font-size: 16px; color: #ffb3a8; }
.msg.ok { color: var(--gold); }

.prompt { display: grid; gap: 12px; text-align: center; padding-block: 8px; }
.prompt h2 { font-family: var(--f-chalk); font-size: 30px; margin: 0; color: var(--gold); text-wrap: balance; }
.prompt p { margin: 0; color: var(--chalk-dim); }
.prompt .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.prompt .row .btn { min-width: 84px; font-size: 18px; padding: 12px 16px; }

/* History */
.hist h3, .setup h3 { margin: 0; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--chalk-dim); font-weight: 600; }
.hist ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 420px; overflow-y: auto; }
.hist li {
  display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: baseline;
  padding: 5px 4px; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums;
}
.hist li .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); align-self: center; }
.hist li[data-t="0"] { --tc: var(--red); }
.hist li[data-t="1"] { --tc: var(--green); }
.hist .hn { font-family: var(--f-chalk); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .hs { font-size: 20px; font-weight: 700; }
.hist .hs.bust { color: #ffb3a8; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
.hist .hs.out { color: var(--gold); }
.hist .hr { font-size: 15px; color: var(--chalk-dim); min-width: 3ch; text-align: right; }
.hist .empty { color: var(--chalk-dim); font-size: 15px; }

/* Setup */
.setup { display: grid; gap: 14px; }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.setup fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; display: grid; gap: 8px; }
.setup legend { padding: 0 6px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
.setup fieldset[data-t="0"] legend { color: var(--red); }
.setup fieldset[data-t="1"] legend { color: var(--green); }
.setup label { display: grid; gap: 3px; font-size: 13px; color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 0.8px; }
.setup input[type="text"], .setup select {
  background: var(--board); color: var(--chalk); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 9px; font-family: var(--f-chalk); font-size: 17px; text-transform: none; letter-spacing: 0; width: 100%;
}
.setup select { font-family: var(--f-num); }
.opts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; }
.opts label { min-width: 140px; }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px !important; color: var(--chalk) !important; font-size: 16px !important; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }
.setup-note { margin: -6px 0 0; color: var(--chalk-dim); font-size: 16px; }
.setup .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

.keys { font-size: 13px; color: var(--chalk-dim); text-align: center; }

@media (max-width: 760px) {
  .play { grid-template-columns: 1fr; }
  .setup-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  body { font-size: 16px; }
  .teams { gap: 8px; }
  .team { padding: 12px 10px 10px; }
  .team-name { font-size: 18px; }
  .players li { grid-template-columns: 12px 1fr auto; gap: 6px; padding: 3px 4px; }
  .players .meta { display: none; }
  .players .pname { font-size: 16px; }
  .quick { gap: 4px; }
  .quick button { font-size: 16px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Oche Board</h1>
      <span class="legs" id="legsLabel"></span>
    </div>
    <div class="tools">
      <button class="btn" id="undoBtn" type="button">Undo</button>
      <button class="btn" id="setupBtn" type="button">Match setup</button>
      <button class="btn primary" id="newGameBtn" type="button">New game</button>
    </div>
  </header>

  <section class="panel setup" id="setup" hidden>
    <h3 id="setupTitle">Match setup</h3>
    <p class="setup-note" id="setupNote" hidden>Enter the team and player names, then press Start game. This clears the current scores.</p>
    <div class="setup-grid" id="setupTeams"></div>
    <div class="opts">
      <label>Starting score
        <select id="optStart"><option value="301">301</option><option value="501">501</option><option value="701">701</option></select>
      </label>
      <label>Throws first in leg 1
        <select id="optFirst"></select>
      </label>
      <label class="check"><input type="checkbox" id="optDouble"> Double out</label>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="setupCancel">Close</button>
      <button class="btn" type="button" id="setupClear" hidden>Clear names</button>
      <button class="btn" type="button" id="setupSave">Save names</button>
      <button class="btn danger" type="button" id="setupReset">Start new match</button>
      <button class="btn primary" type="button" id="setupStart" hidden>Start game</button>
    </div>
  </section>

  <section class="teams" id="teams"></section>

  <section class="play">
    <div class="panel" id="inputPanel"></div>
    <div class="panel hist">
      <h3 id="histTitle">This leg</h3>
      <ol id="hist"></ol>
    </div>
  </section>
</div>

<script>
(function () {
  const STORE = "oche-board-v1";
  const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);

  // ---------- Checkout finder ----------
  const DOUBLE_PREF = [20, 16, 18, 12, 10, 8, 19, 17, 15, 14, 13, 11, 9, 7, 6, 5, 4, 3, 2, 1].map(n => ({ v: n * 2, l: "D" + n }));
  DOUBLE_PREF.push({ v: 50, l: "Bull" });
  const SETUP = [];
  for (let n = 20; n >= 1; n--) SETUP.push(n * 3);
  SETUP.push(50, 25);
  for (let n = 20; n >= 1; n--) SETUP.push(n);
  function dartLabel(v) {
    if (v >= 1 && v <= 20) return String(v);
    if (v === 25) return "25";
    if (v === 50) return "Bull";
    if (v % 3 === 0 && v / 3 <= 20) return "T" + v / 3;
    if (v % 2 === 0 && v / 2 <= 20) return "D" + v / 2;
    return null;
  }
  const coCache = new Map();
  function checkout(r) {
    if (coCache.has(r)) return coCache.get(r);
    let res = null;
    if (r >= 2 && r <= 170) {
      const d1 = DOUBLE_PREF.find(d => d.v === r);
      if (d1) res = [d1.l];
      if (!res) for (const d of DOUBLE_PREF) {
        const a = dartLabel(r - d.v);
        if (r - d.v > 0 && a) { res = [a, d.l]; break; }
      }
      if (!res) outer: for (const d of DOUBLE_PREF) {
        for (const f of SETUP) {
          const rest = r - d.v - f;
          const b = rest > 0 ? dartLabel(rest) : null;
          if (b) { res = [dartLabel(f), b, d.l]; break outer; }
        }
      }
    }
    coCache.set(r, res);
    return res;
  }

  // ---------- State ----------
  function defaults() {
    return {
      setup: {
        teams: [
          { name: "Home", players: ["Dave", "Sue", "Mick", "Jo"] },
          { name: "Away", players: ["Tom", "Lisa", "Raj", "Kev"] }
        ],
        start: 501, doubleOut: true, firstTeam: 0
      },
      turns: [],   // {leg, team, player, score, bust, out, darts}
      legNo: 0
    };
  }
  let S = load() || defaults();
  let entry = "";
  let pending = null;   // checkout awaiting dart count
  let message = { text: "", ok: false };
  let resetArmed = false;

  function load() {
    try { const raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* storage unavailable */ }
  }

  // ---------- Derived ----------
  const legTurns = () => S.turns.filter(t => t.leg === S.legNo);
  const legStarter = () => (S.setup.firstTeam + S.legNo) % 2;
  function remaining(team) {
    return legTurns().reduce((r, t) => (t.team === team && !t.bust ? r - t.score : r), S.setup.start);
  }
  function legWinner() {
    const out = legTurns().find(t => t.out);
    return out ? out.team : null;
  }
  function legsWon() {
    const w = [0, 0];
    S.turns.forEach(t => { if (t.out) w[t.team]++; });
    return w;
  }
  function current() {
    const n = legTurns().length;
    const team = (legStarter() + n) % 2;
    const player = Math.floor(n / 2) % 4;
    return { team, player };
  }
  function nextFor(team) {
    // Index of the player on `team` who throws next for that team
    const n = legTurns().length;
    const cur = current();
    if (cur.team === team) return cur.player;
    return Math.floor((n + 1) / 2) % 4;
  }
  function playerStats(team, player) {
    let darts = 0, pts = 0;
    S.turns.forEach(t => {
      if (t.team !== team || t.player !== player) return;
      darts += t.out ? t.darts : 3;
      pts += t.bust ? 0 : t.score;
    });
    return { darts, avg: darts ? (pts / darts) * 3 : null };
  }
  function lastScore(team) {
    const t = legTurns().filter(x => x.team === team).pop();
    if (!t) return null;
    return t.bust ? "Bust" : String(t.score);
  }

  // ---------- Actions ----------
  function setMsg(text, ok) { message = { text, ok: !!ok }; }

  function submit(raw) {
    if (legWinner() !== null || pending) return;
    if (raw === "") { setMsg("Type the total for the three darts, then press Enter."); return render(); }
    const score = Number(raw);
    const { team, player } = current();
    const rem = remaining(team);
    if (!Number.isInteger(score) || score < 0 || score > 180 || IMPOSSIBLE.has(score)) {
      setMsg(score + " can't be scored with three darts. Check the total.");
      entry = ""; return render();
    }
    const after = rem - score;
    if (after === 0) {
      if (S.setup.doubleOut && !checkout(score)) {
        setMsg(score + " isn't a finish with a double. Check the total.");
        entry = ""; return render();
      }
      pending = { team, player, score };
      entry = ""; setMsg("");
      return render();
    }
    const bust = after < 0 || (S.setup.doubleOut && after === 1);
    S.turns.push({ leg: S.legNo, team, player, score, bust, out: false, darts: 3 });
    entry = "";
    setMsg(bust ? `Bust. ${S.setup.teams[team].name} stay on ${rem}.` : "");
    save(); render();
  }

  function confirmOut(darts) {
    if (!pending) return;
    const p = pending; pending = null;
    if (darts === 0) {
      S.turns.push({ leg: S.legNo, team: p.team, player: p.player, score: p.score, bust: true, out: false, darts: 3 });
      setMsg(`Bust. ${S.setup.teams[p.team].name} stay on ${p.score}.`);
    } else {
      S.turns.push({ leg: S.legNo, team: p.team, player: p.player, score: p.score, bust: false, out: true, darts });
      setMsg("");
    }
    save(); render();
  }

  function undo() {
    if (pending) { pending = null; setMsg(""); return render(); }
    if (entry) { entry = ""; return render(); }
    if (legTurns().length === 0 && S.legNo > 0) {
      S.legNo--;   // reopen the finished leg so its winning throw can be undone
    } else if (S.turns.length) {
      S.turns.pop();
    } else return;
    setMsg("Last throw removed.", true);
    save(); render();
  }

  function nextLeg() {
    S.legNo++; entry = ""; setMsg("");
    save(); render();
  }

  // ---------- Render ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);

  function render() {
    const won = legsWon();
    const winner = legWinner();
    const cur = current();
    const teams = S.setup.teams;
    $("legsLabel").innerHTML = `Leg ${S.legNo + 1} · Legs <b>${won[0]}–${won[1]}</b>`;
    $("undoBtn").disabled = !S.turns.length && !entry && !pending && S.legNo === 0;

    // Teams
    $("teams").innerHTML = teams.map((t, ti) => {
      const rem = remaining(ti);
      const active = winner === null && cur.team === ti;
      const up = nextFor(ti);
      const co = S.setup.doubleOut && winner === null ? checkout(rem) : null;
      const last = lastScore(ti);
      const rows = t.players.map((p, pi) => {
        const st = playerStats(ti, pi);
        const isNow = winner === null && pi === up;
        return `<li class="${isNow && active ? "now" : ""}">
          <span class="mark">${isNow ? (active ? "▶" : "›") : ""}</span>
          <span class="pname">${esc(p)}</span>
          <span class="avg">${st.avg === null ? "–" : st.avg.toFixed(1)}</span>
          <span class="meta">${st.darts} darts</span>
        </li>`;
      }).join("");
      return `<article class="team ${active ? "active" : ""}" data-t="${ti}">
        <div class="team-head">
          <span class="team-name">${esc(t.name)}</span>
          <span class="team-legs">${won[ti]} ${won[ti] === 1 ? "leg" : "legs"}</span>
        </div>
        <div class="remaining" aria-label="${esc(t.name)} need ${rem}">${rem}</div>
        <div class="sub">
          ${last !== null ? `<span>Last: ${esc(last)}</span>` : `<span>${legStarter() === ti ? "Throws first" : "Throws second"}</span>`}
          ${co ? `<span class="co">${co.join(" · ")}</span>` : ""}
        </div>
        <ul class="players">
          <li class="hdr"><span></span><span>Player</span><span>3-dart avg</span><span class="meta"></span></li>
          ${rows}
        </ul>
      </article>`;
    }).join("");

    // Input panel
    const ip = $("inputPanel");
    if (winner !== null) {
      const out = legTurns().find(t => t.out);
      const name = teams[out.team].players[out.player];
      ip.innerHTML = `<div class="prompt">
        <h2>Game shot! ${esc(teams[winner].name)} take leg ${S.legNo + 1}</h2>
        <p>${esc(name)} checked out ${out.score} in ${out.darts} ${out.darts === 1 ? "dart" : "darts"}. Legs: ${won[0]}–${won[1]}.</p>
        <div class="row"><button class="btn primary" type="button" data-act="next">Start leg ${S.legNo + 2}</button></div>
        <p>${esc(teams[(S.setup.firstTeam + S.legNo + 1) % 2].name)} throw first next leg.</p>
      </div>`;
    } else if (pending) {
      const name = teams[pending.team].players[pending.player];
      const min = S.setup.doubleOut ? checkout(pending.score).length : 1;
      const btns = [1, 2, 3].map(d => `<button class="btn ${d >= min ? "primary" : ""}" type="button" data-out="${d}" ${d < min ? "disabled" : ""}>${d} ${d === 1 ? "dart" : "darts"}</button>`).join("");
      ip.innerHTML = `<div class="prompt">
        <h2>${esc(name)} on ${pending.score} to finish</h2>
        <p>${S.setup.doubleOut ? "Did the last dart land in the double? " : ""}How many darts did it take?</p>
        <div class="row">${btns}</div>
        <div class="row">
          ${S.setup.doubleOut ? `<button class="btn danger" type="button" data-out="0">Missed the double (bust)</button>` : ""}
          <button class="btn" type="button" data-act="cancel">Re-enter score</button>
        </div>
      </div>`;
    } else {
      const name = teams[cur.team].players[cur.player];
      const rem = remaining(cur.team);
      const co = S.setup.doubleOut ? checkout(rem) : null;
      const quick = [0, 26, 30, 41, 45, 60, 81, 85, 100, 140, 180];
      ip.innerHTML = `
        <div class="thrower">
          <span class="who" style="color:var(${cur.team ? "--green" : "--red"})">${esc(name)}</span>
          <span>to throw for ${esc(teams[cur.team].name)}</span>
          <span class="need">· needs ${rem}</span>
        </div>
        <div class="display">
          <span class="val ${entry ? "" : "empty"}">${entry || "Enter score"}</span>
          <span class="hint">${co ? "Out: " + co.join(" ") : (S.setup.doubleOut && rem <= 170 ? "No finish yet" : "")}</span>
        </div>
        <div class="quick">${quick.map(q => `<button type="button" data-quick="${q}" class="${q >= 100 ? "ton" : q === 0 ? "wide" : q === 30 ? "dummy" : ""}" ${q === 30 ? 'title="Dummy player: scores 30"' : ""}>${q === 0 ? "No score" : q === 30 ? "30<small>dummy</small>" : q}</button>`).join("")}</div>
        <div class="pad">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-key="${n}">${n}</button>`).join("")}
          <button type="button" class="fn" data-key="del">Del</button>
          <button type="button" data-key="0">0</button>
          <button type="button" class="enter" data-key="enter">Enter</button>
        </div>
        <div class="msg ${message.ok ? "ok" : ""}" role="status">${esc(message.text)}</div>
        <div class="keys">Keyboard: type the score, Enter to submit, Backspace to correct, Ctrl+Z to undo</div>`;
    }
    if (winner !== null || pending) {
      if (message.text) ip.insertAdjacentHTML("beforeend", `<div class="msg ${message.ok ? "ok" : ""}">${esc(message.text)}</div>`);
    }

    // History
    const lt = legTurns();
    const running = [S.setup.start, S.setup.start];
    const items = lt.map(t => {
      if (!t.bust) running[t.team] -= t.score;
      return { t, rem: running[t.team] };
    }).reverse();
    $("histTitle").textContent = `Leg ${S.legNo + 1} throws`;
    $("hist").innerHTML = items.length ? items.map(({ t, rem }) => `
      <li data-t="${t.team}">
        <span class="dot"></span>
        <span class="hn">${esc(teams[t.team].players[t.player])}</span>
        <span class="hs ${t.bust ? "bust" : t.out ? "out" : ""}">${t.bust ? "Bust " + t.score : t.score}</span>
        <span class="hr">${rem}</span>
      </li>`).join("") : `<li class="empty">No throws yet. ${esc(teams[legStarter()].name)} throw first.</li>`;
  }

  // ---------- Setup ----------
  function openSetup(mode) {
    const st = S.setup;
    const isNew = mode === "new";
    $("setupTeams").innerHTML = st.teams.map((t, ti) => `
      <fieldset data-t="${ti}">
        <legend>Team ${ti + 1}</legend>
        <label>Team name <input type="text" id="tn${ti}" value="${esc(t.name)}" maxlength="24"></label>
        ${t.players.map((p, pi) => `<label>Player ${pi + 1} <input type="text" id="pn${ti}${pi}" value="${esc(p)}" maxlength="20"></label>`).join("")}
      </fieldset>`).join("");
    $("optStart").value = String(st.start);
    $("optDouble").checked = st.doubleOut;
    $("optFirst").innerHTML = st.teams.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
    $("optFirst").value = String(st.firstTeam);
    resetArmed = false; $("setupReset").textContent = "Start new match";
    $("setupTitle").textContent = isNew ? "New game" : "Match setup";
    $("setupNote").hidden = !isNew;
    $("setupClear").hidden = !isNew;
    $("setupStart").hidden = !isNew;
    $("setupSave").hidden = isNew;
    $("setupReset").hidden = isNew;
    $("setupCancel").textContent = isNew ? "Cancel" : "Close";
    $("setup").hidden = false;
    if (isNew) {
      $("setup").scrollIntoView({ block: "start" });
      const first = $("tn0"); first.focus(); first.select();
    }
  }
  function startMatch() {
    readNames();
    S.setup.start = Number($("optStart").value);
    S.setup.doubleOut = $("optDouble").checked;
    S.setup.firstTeam = Number($("optFirst").value);
    S.turns = []; S.legNo = 0; entry = ""; pending = null;
    setMsg(`New game. ${S.setup.teams[S.setup.firstTeam].name} throw first.`, true);
    save(); $("setup").hidden = true; render();
  }
  function readNames() {
    S.setup.teams.forEach((t, ti) => {
      t.name = $("tn" + ti).value.trim() || "Team " + (ti + 1);
      t.players = t.players.map((p, pi) => $("pn" + ti + pi).value.trim() || "Player " + (pi + 1));
    });
  }
  $("setupBtn").onclick = () => ($("setup").hidden || $("setupTitle").textContent !== "Match setup" ? openSetup("settings") : ($("setup").hidden = true));
  $("newGameBtn").onclick = () => openSetup("new");
  $("setupStart").onclick = startMatch;
  $("setupClear").onclick = () => {
    $("setupTeams").querySelectorAll("input[type=text]").forEach(i => { i.value = ""; });
    $("tn0").focus();
  };
  // Team name changes update the "throws first" choice live
  $("setupTeams").addEventListener("input", e => {
    const m = /^tn(\d)$/.exec(e.target.id);
    if (m) $("optFirst").options[Number(m[1])].textContent = e.target.value.trim() || "Team " + (Number(m[1]) + 1);
  });
  $("setup").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("input[type=text]") && !$("setupStart").hidden) { e.preventDefault(); startMatch(); }
  });
  $("setupCancel").onclick = () => { $("setup").hidden = true; };
  $("setupSave").onclick = () => { readNames(); save(); $("setup").hidden = true; setMsg("Names saved.", true); render(); };
  $("setupReset").onclick = () => {
    if (!resetArmed && S.turns.length) {
      resetArmed = true; $("setupReset").textContent = "Tap again to clear all scores";
      return;
    }
    startMatch();
  };

  // ---------- Input wiring ----------
  function key(k) {
    if (legWinner() !== null || pending) return;
    if (k === "del") entry = entry.slice(0, -1);
    else if (k === "enter") return submit(entry);
    else if (entry.length < 3) entry = (entry + k).replace(/^0+(?=\d)/, "");
    setMsg(""); render();
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.key) key(b.dataset.key);
    else if (b.dataset.quick) { entry = ""; submit(b.dataset.quick); }
    else if (b.dataset.out) confirmOut(Number(b.dataset.out));
    else if (b.dataset.act === "next") nextLeg();
    else if (b.dataset.act === "cancel") { pending = null; render(); }
  });
  $("undoBtn").onclick = undo;
  document.addEventListener("keydown", e => {
    if (!$("setup").hidden && e.target.closest("#setup")) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); return undo(); }
    if (pending && /^[123]$/.test(e.key)) return confirmOut(Number(e.key));
    if (/^\d$/.test(e.key)) key(e.key);
    else if (e.key === "Backspace") key("del");
    else if (e.key === "Enter") {
      if (legWinner() !== null) { e.preventDefault(); nextLeg(); }
      else if (!e.target.closest("button")) key("enter");
    }
    else if (e.key === "Escape" && pending) { pending = null; render(); }
  });

  window.claude?.hot?.snapshot?.(() => ({ entry }));
  const start = data => { entry = (data && data.entry) || ""; render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
